<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Chortle promotional banner</title>
<link rel="stylesheet" href="/src/app.css">
<style>
body { width:2400px; min-width:2400px; height:800px; min-height:800px; overflow:hidden; }
.banner { height:800px; padding:58px 100px; display:grid; grid-template-columns:1fr 650px; gap:110px; border-top:8px solid var(--ink); border-bottom:8px solid var(--ink); }
.copy { display:flex; flex-direction:column; align-items:flex-start; justify-content:center; }
.edition-line { display:flex; align-items:center; gap:38px; margin:0 0 18px 8px; }
.edition { margin:0; color:var(--muted); font-size:24px; font-weight:bold; letter-spacing:.2em; }
h1 { margin:0 0 36px; font:700 208px/.88 var(--display); letter-spacing:-.07em; }
.tiles { display:flex; gap:12px; margin:0 0 32px 6px; }
.tile { position:relative; width:138px; height:138px; background:transparent; color:var(--ink); border:2px solid var(--ink); display:grid; place-items:center; padding-bottom:20px; font-size:82px; font-weight:bold; line-height:1; }
.tile.plain { padding-bottom:20px; }
.tile small { position:absolute; bottom:10px; font-size:20px; }
.tagline { margin:0 0 20px 6px; font-size:32px; color:var(--ink); }
.url { margin:0; color:var(--burgundy); font-size:27px; }
.diagram { align-self:center; position:relative; padding:0 0 28px 28px; }
.board { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); grid-template-rows:repeat(8,minmax(0,1fr)); width:608px; height:608px; position:relative; border:1px solid var(--line); }
.square { background:#e8e5db; display:grid; place-items:center; }
.square.dark { background:repeating-linear-gradient(135deg,transparent,transparent 14px,#999c9666 14px,#999c9666 16px),#b0b1aa; }
.square img { width:92%; height:92%; }
.arrow { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.files { position:absolute; bottom:0; left:28px; width:608px; display:grid; grid-template-columns:repeat(8,1fr); text-align:center; }
.ranks { position:absolute; top:0; left:0; height:608px; display:grid; grid-template-rows:repeat(8,1fr); align-items:center; }
.files,.ranks { font-size:21px; color:var(--burgundy); font-weight:bold; }
</style>
<style>
body {width:1200px;min-width:1200px;height:630px;min-height:630px;}
.banner {height:630px;padding:48px 52px;grid-template-columns:600px 450px;gap:42px;border-width:6px;}
.edition-line {gap:0;margin:0 0 28px 4px;}
.edition {font-size:18px;letter-spacing:.2em;}
.url {display:none;}
h1 {font-size:116px;margin:0 0 32px;}
.tiles {gap:9px;margin:0 0 28px 4px;}
.tile {width:92px;height:98px;font-size:56px;padding-bottom:17px;}
.tile.plain {padding-bottom:17px;}
.tile small {font-size:14px;bottom:9px;}
.tagline {font-size:27px;line-height:1.4;max-width:530px;margin-left:4px;}
.diagram {padding:0 0 24px 24px;}
.board {width:426px;height:426px;}
.files {left:24px;width:426px;}
.ranks {height:426px;}
.files,.ranks {font-size:16px;}
</style><main class="banner">
 <section class="copy">
  <div class="edition-line"><p class="edition">DAILY EDITION</p><p class="url">chortle.charlesblancas.com</p></div>
  <h1>CHORTLE</h1>
  <div class="tiles" aria-label="PAP, a guess in progress awaiting the E move">
   <div class="tile plain">P</div>
   <div class="tile">A<small>A1→E1</small></div>
   <div class="tile plain">P</div>
   <div class="tile"></div>
   <div class="tile"></div>
  </div>
  <p class="tagline">A word puzzle. A chess puzzle. One daily challenge.</p>
 </section>
 <section class="diagram" aria-label="Black to play queen E1 to H4, checkmate, to enter E">
  <div class="board" id="board"></div>
  <div class="files" id="files"></div><div class="ranks" id="ranks"></div>
 </section>
</main>
<script type="module">
// Real PAPER puzzle ZwDjq after ...Qe1+ Kg4. Qh4# is still unplayed.
const position = {d8:'wR',h8:'wR',a7:'bP',b7:'bP',c7:'bP',f7:'bP',f6:'bK',h6:'bP',g5:'bP',c4:'wP',g4:'wK',b3:'wP',f3:'wP',g2:'wP',h2:'wP',e1:'bQ'};
const files = [...'hgfedcba'];
for(let rank=1;rank<=8;rank++) for(const file of files) {
 const cell=document.createElement('div');
 cell.className='square'+((file.charCodeAt(0)-97+rank)%2===1?' dark':'');
 if(position[file+rank]) { const img=document.createElement('img'); img.src='/pieces/cburnett/'+position[file+rank]+'.svg'; img.alt=position[file+rank]; cell.append(img); }
 board.append(cell);
}
board.insertAdjacentHTML('beforeend','<svg class="arrow" viewBox="0 0 800 800"><defs><marker id="head" markerWidth="3" markerHeight="3" refX="2.4" refY="1.5" orient="auto"><path d="M0,0 L3,1.5 L0,3 Z" fill="#702d31"/></marker></defs><path d="M335 65 L62 338" stroke="#702d31" opacity=".8" stroke-width="12" marker-end="url(#head)"/></svg>');
document.querySelector('#files').innerHTML=files.map(f=>'<span>'+f.toUpperCase()+'</span>').join('');
document.querySelector('#ranks').innerHTML=Array.from({length:8},(_,i)=>'<span>'+(i+1)+'</span>').join('');
</script>
</html>
